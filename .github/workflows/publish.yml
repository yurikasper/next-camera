name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check package version matches tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      # Compile before publishing so a broken build never reaches npm
      - name: Build standalone executables
        run: bun run build:all

      # Before npm: if publishing fails, the job can be re-run and this step just replaces the files
      - name: Attach executables to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/next-camera-* --clobber

      # Prerelease versions (0.2.0-beta.1) go to their own dist-tag ("beta") instead of "latest".
      # Trusted publishing (OIDC via id-token: write): no npm token needed once it's set up on npmjs.com
      - name: Publish to NPM
        run: |
          DIST_TAG=$(node -p "const pre = require('./package.json').version.split('-')[1]; pre ? (pre.split('.')[0] || 'next') : 'latest'")
          npm publish --provenance --tag "$DIST_TAG"
